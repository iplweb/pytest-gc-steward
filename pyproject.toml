[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pytest-gc-steward"
version = "0.1.0"
description = "Keep pytest workers from bloating: gc.freeze(), periodic or RSS-triggered garbage collection, and reports of what the cyclic GC collects."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Michał Pasternak", email = "michal.dtz@gmail.com" },
]
keywords = ["pytest", "gc", "garbage collection", "memory", "xdist", "reference cycles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7"]

[project.optional-dependencies]
rss = ["psutil>=5"]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "psutil>=5",
    "ruff>=0.15,<0.16",
]

[project.entry-points.pytest11]
gc_steward = "pytest_gc_steward.plugin"

[project.urls]
Funding = "https://buymeacoffee.com/mpasternak"
Homepage = "https://github.com/iplweb/pytest-gc-steward"
Source = "https://github.com/iplweb/pytest-gc-steward"
Issues = "https://github.com/iplweb/pytest-gc-steward/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_gc_steward"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
